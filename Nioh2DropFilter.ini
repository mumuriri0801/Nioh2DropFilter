[General]
; 1 = 擋掉敵人 / BOSS 死亡時的掉落（道具與裝備）
Enabled=1
; 開關熱鍵（虛擬鍵碼，預設 F6）
ToggleKey=0x75

[Drops]
; 1 = 把每個擲出的掉落道具 ID 寫進 Nioh2DropFilter.log（用來找出要保留的道具）
LogDrops=1
; 照常掉落的道具 ID，逗號分隔，例如 KeepItemIds=0x1234, 0x5678
KeepItemIds=
; 一定擋掉的道具 ID（優先於 KeepItemTypes），逗號分隔。0xAE24 = 奈落獄的酒盅（推測，類型 0x03）
BlockItemIds=0xAE24
; 照常掉落的道具類型（道具參數 +0x4），逗號分隔。0x03 = 重要道具（已確認）、0x26 = 百鬼夜行繪卷（推測）
KeepItemTypes=0x03, 0x26
; 黑名單：只擋這些類型，沒列出的類型（例如任務鑰匙）照常掉落；留空 = 除保留清單外全部擋掉
;   0x01 消耗品（推測）、0x02 上限 99 的道具（推測）、0x04~0x06 彈藥（0x04 箭已確認）、0x21 魂石類（推測）、0x24 素材（已確認）
;   0x09~0x1A 武器（推測）、0x1B~0x1F 防具（推測）、0x20 飾品（推測）、0x25 茶器（推測）
BlockItemTypes=0x01, 0x02, 0x04, 0x05, 0x06, 0x21, 0x24, 0x25, 0x09, 0x0A, 0x0B, 0x0C, 0x0D, 0x0E, 0x0F, 0x10, 0x11, 0x12, 0x13, 0x14, 0x15, 0x16, 0x17, 0x18, 0x19, 0x1A, 0x1B, 0x1C, 0x1D, 0x1E, 0x1F, 0x20

[Debug]
; 逆向用：啟用後可透過 Nioh2DropFilter.watch.txt 對位址設硬體中斷點（一般玩家請保持 0）
EnableWatch=0
